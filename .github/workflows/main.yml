name: 2-Hour High Quality Auto Post
on:
  schedule:
    - cron: '0 */2 * * *'  # 2시간마다 자동 실행
  workflow_dispatch:       # 우리가 직접 누를 수 있는 수동 버튼

permissions:               # 중요: 봇이 글을 쓸 수 있게 권한 부여
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install google-generativeai

      - name: Generate Post with Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_post.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Post: New Life Hack Entry [$(date)]" || echo "No changes to commit"
          git push
